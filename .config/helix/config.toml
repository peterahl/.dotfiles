theme = "catppuccin_mocha"

[editor]
scrolloff = 999
line-number = "relative"
mouse = false
color-modes = true
cursorline = true
auto-format = true
true-color = true
# bufferline = "multiple"
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
display-messages = true
display-inlay-hints = true

[keys.normal]
A-x = "command_palette"
G = "goto_file_end"
C-g = [
  ':sh rm -f /tmp/lazygit-selected-file',
  ':insert-output lazygit',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/lazygit-selected-file}',
  ':sh rm -f /tmp/lazygit-selected-file',
  ':redraw',
  ':reload-all',
]
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
A-r = ':rla'
A-g = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

[keys.normal.g]
u = "switch_to_lowercase"
U = "switch_to_uppercase"

# --- Space Leader Tree (Doom Emacs / Spacemacs Mnemonic Layout) ---

[keys.normal."space"]
"space" = "command_palette"
"?" = "command_palette"
"," = "buffer_picker"
"." = "file_picker"
"/" = "global_search"
j = "jumplist_picker"
y = "yank_to_clipboard"
Y = "yank_main_selection_to_clipboard"
p = "paste_clipboard_after"
P = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
B = ":pipe-to helix-git-blame"

# [b]uffer - Buffert-hantering
[keys.normal."space".b]
b = "buffer_picker"
d = ":buffer-close"
k = ":buffer-close"
n = "goto_next_buffer"
p = "goto_previous_buffer"
l = "goto_last_accessed_file"
r = ":reload"
o = ":buffer-close-others"

# [c]ode - Kodåtgärder, LSP, refaktorering, kommentarer och diagnostik
[keys.normal."space".c]
c = "toggle_comments"
C = "toggle_comments"
l = "toggle_comments"
a = "code_action"
f = ":format"
r = "rename_symbol"
R = "goto_reference"
d = "diagnostics_picker"
D = "workspace_diagnostics_picker"
k = "hover"
h = "hover"
s = "symbol_picker"
S = "workspace_symbol_picker"
i = "goto_implementation"
t = "goto_type_definition"

# [f]ile - Filhantering och sparning
[keys.normal."space".f]
f = "file_picker"
d = "file_picker_in_current_buffer_directory"
s = ":w"
S = ":wa"
r = ":reload"

# [g]it - Version control (Lazygit, blame, ändrade filer)
[keys.normal."space".g]
g = [
  ':sh rm -f /tmp/lazygit-selected-file',
  ':insert-output lazygit',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/lazygit-selected-file}',
  ':sh rm -f /tmp/lazygit-selected-file',
  ':redraw',
  ':reload-all',
]
b = ":sh blame %{buffer_name} %{cursor_line}"
l = ":sh blame --url-only %{cursor_line} %{buffer_name} | xargs -I{} xdg-open {}"
f = "changed_file_picker"
c = "changed_file_picker"

# [o]pen - Externa verktyg (Lazygit, Yazi)
[keys.normal."space".o]
g = [
  ':sh rm -f /tmp/lazygit-selected-file',
  ':insert-output lazygit',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/lazygit-selected-file}',
  ':sh rm -f /tmp/lazygit-selected-file',
  ':redraw',
  ':reload-all',
]
y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# [q]uit - Avsluta och reload
[keys.normal."space".q]
q = ":q"
a = ":qa"
r = ":config-reload"

# [s]earch - Sökning i projekt och filer
[keys.normal."space".s]
f = "global_search"
s = "workspace_symbol_picker"
S = "symbol_picker"
b = "search_selection"
j = "jumplist_picker"
r = "goto_reference"

# [t]oggle - Växla inställningar (inlay hints, soft wrap, line numbers)
[keys.normal."space".t]
i = ":toggle-option lsp.display-inlay-hints"
w = ":toggle-option soft-wrap.enable"
l = ":toggle-option line-number"

# [u]ser - Användarkonfiguration (Userland)
[keys.normal."space".u]
e = ":open ~/.config/helix/config.toml"
c = ":open ~/.config/helix/config.toml"
r = ":config-reload"

# [w]indow - Fönster/splits och navigering
[keys.normal."space".w]
v = "vsplit"
s = "hsplit"
c = "wclose"
o = "wonly"
h = "jump_view_left"
j = "jump_view_down"
k = "jump_view_up"
l = "jump_view_right"
w = "rotate_view"
